name: Refresh GlobalNews

on:
  workflow_dispatch:
    inputs:
      window_hours:
        description: News lookback window (12-72 hours)
        required: false
        default: "30"
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-globalnews
  cancel-in-progress: false

jobs:
  refresh:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test source
        run: npm test

      - name: Fetch and verify current headlines
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          HOT_NEWS_WINDOW_HOURS: ${{ inputs.window_hours || '30' }}
          HOT_NEWS_REFRESH_ONLY: "true"
          HOT_NEWS_ARCHIVE_PATH: site/data/recent.json
        run: npm run refresh

      - name: Save news snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/recent.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh GlobalNews snapshot"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then
                break
              fi
              if [[ "$attempt" == "3" ]]; then
                exit 1
              fi
              sleep $((attempt * 3))
            done
          fi

      - name: Build refreshed site
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy refreshed site
        id: deployment
        uses: actions/deploy-pages@v4
